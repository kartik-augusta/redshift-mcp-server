<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile /etc/httpd/ssl/server.crt
    SSLCertificateKeyFile /etc/httpd/ssl/server.key

    ProxyPreserveHost Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # MCP Server on port 8001 (Streamable HTTP / SSE)
    ProxyPass /mcp http://127.0.0.1:8001/mcp flushpackets=on
    ProxyPassReverse /mcp http://127.0.0.1:8001/mcp

    # Streamlit WebSockets on port 8000
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:8000/$1 [P,L]

    ProxyPass /_stcore/stream ws://127.0.0.1:8000/_stcore/stream
    ProxyPassReverse /_stcore/stream ws://127.0.0.1:8000/_stcore/stream

    # Streamlit HTTP UI on port 8000
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog /var/log/httpd/app-error.log
    CustomLog /var/log/httpd/app-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>
